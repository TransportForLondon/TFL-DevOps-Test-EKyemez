name: Upload Data Files and Run Data Upload Function

on:
  push:
    branches:
      - main
    paths:
      - 'src/DataUpload/Enrollment2024/Students.csv'
      - 'src/DataUpload/Enrollment2024/Enrollments.csv'
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  upload-and-run:
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required configuration
        run: |
          if [ -z "${{ vars.DATAUPLOAD_FUNCTIONAPP_NAME }}" ]; then
            echo "DATAUPLOAD_FUNCTIONAPP_NAME is not set."
            exit 1
          fi

          if [ -z "${{ vars.RESOURCE_GROUP_NAME }}" ]; then
            echo "RESOURCE_GROUP_NAME is not set."
            exit 1
          fi

      - name: Prepare data zip payload
        run: |
          mkdir -p out/data
          cp src/DataUpload/Enrollment2024/Students.csv out/data/Students.csv
          cp src/DataUpload/Enrollment2024/Enrollments.csv out/data/Enrollments.csv
          cd out/data
          zip -r ../data-files.zip .

      - name: Upload CSV files to Function App wwwroot/Data
        run: |
          APP_NAME="${{ vars.DATAUPLOAD_FUNCTIONAPP_NAME }}"
          RG_NAME="${{ vars.RESOURCE_GROUP_NAME }}"

          PUBLISH_USER=$(az functionapp deployment list-publishing-profiles --name "$APP_NAME" --resource-group "$RG_NAME" --query "[?publishMethod=='MSDeploy'] | [0].userName" -o tsv)
          PUBLISH_PASSWORD=$(az functionapp deployment list-publishing-profiles --name "$APP_NAME" --resource-group "$RG_NAME" --query "[?publishMethod=='MSDeploy'] | [0].userPWD" -o tsv)
          SCM_HOST=$(az functionapp deployment list-publishing-profiles --name "$APP_NAME" --resource-group "$RG_NAME" --query "[?publishMethod=='MSDeploy'] | [0].publishUrl" -o tsv)

          if [ -z "$PUBLISH_USER" ] || [ -z "$PUBLISH_PASSWORD" ] || [ -z "$SCM_HOST" ]; then
            echo "Unable to resolve Kudu publishing credentials from Function App publishing profile."
            exit 1
          fi

          curl -fS -X PUT \
            -u "$PUBLISH_USER:$PUBLISH_PASSWORD" \
            --data-binary "@out/data-files.zip" \
            "https://$SCM_HOST/api/zip/site/wwwroot/Data/"

      - name: Trigger data upload function
        run: |
          APP_NAME="${{ vars.DATAUPLOAD_FUNCTIONAPP_NAME }}"
          RG_NAME="${{ vars.RESOURCE_GROUP_NAME }}"

          FUNCTION_KEY=$(az functionapp function keys list --resource-group "$RG_NAME" --name "$APP_NAME" --function-name RunEnrollmentUpload --query default -o tsv)

          if [ -z "$FUNCTION_KEY" ]; then
            echo "Unable to retrieve function key for RunEnrollmentUpload."
            exit 1
          fi

          RESPONSE_FILE="out/function-response.json"
          STATUS_CODE=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST "https://$APP_NAME.azurewebsites.net/api/data-upload/run?code=$FUNCTION_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "Function response status: $STATUS_CODE"
          cat "$RESPONSE_FILE"

          if [ "$STATUS_CODE" -ge 400 ]; then
            echo "Function execution failed."
            exit 1
          fi
