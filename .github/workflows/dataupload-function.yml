name: Build and Deploy Data Upload Function

on:
  push:
    branches:
      - main
    paths:
      - 'src/DataUpload.FunctionApp/**'
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  deploy-function:
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure required app setting value exists
        run: |
          if [ -z "${{ vars.DATAUPLOAD_FUNCTIONAPP_NAME }}" ]; then
            echo "DATAUPLOAD_FUNCTIONAPP_NAME is not set."
            exit 1
          fi

      - name: Deploy Azure Function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.DATAUPLOAD_FUNCTIONAPP_NAME }}
          package: src/DataUpload.FunctionApp
